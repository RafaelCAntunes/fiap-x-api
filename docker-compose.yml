services:
  db:
    image: postgres:15-alpine
    container_name: fiap_x_db
    environment:
      POSTGRES_USER: user_fiap
      POSTGRES_PASSWORD: password_fiap
      POSTGRES_DB: fiap_x_video_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_fiap -d fiap_x_video_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fiap-network

  localstack:
    image: localstack/localstack
    container_name: fiap_x_aws
    ports:
      - "4566:4566"         
    volumes:
      - "./internal/infra/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh" 
    environment:
      - SERVICES=s3,sqs
      - DEFAULT_REGION=us-east-1
    networks:
      - fiap-network

  worker:
    build:
      context: ../fiap-x-worker 
      dockerfile: Dockerfile
    container_name: fiap_x_worker
    environment:
      - APP_ENV=local
      - DB_HOST=db 
      - AWS_ENDPOINT=http://localstack:4566      
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/video-queue
      - AWS_ACCESS_KEY_ID=test              
      - AWS_SECRET_ACCESS_KEY=test       
      - AWS_REGION=us-east-1               
    depends_on:
      db:
        condition: service_healthy # Espera o Postgres passar no Healthcheck
      localstack:
        condition: service_started
    networks:
      - fiap-network

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

networks:
  fiap-network:
    driver: bridge